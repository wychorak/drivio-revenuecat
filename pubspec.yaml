name: drivio
description: "Drivio - polska aplikacja pomagająca zdać egzamin na prawo jazdy."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^5.6.6
  firebase_app_check: ^0.3.2+10
  purchases_flutter: ^10.2.0
  firebase_storage: ^12.4.4

  # Privacy-safe iOS monetization
  google_mobile_ads: ^9.0.0

  # Maps
  google_maps_flutter: ^2.10.0

  # In-app purchase

  # Storage
  shared_preferences: ^2.5.3

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # Utilities
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  image_path_android: "assets/images/app_icon.png"
  image_path_ios: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/icon.png"
  macos:
    generate: true
    image_path: "assets/images/icon.png"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 48

flutter_native_splash:
  color: "#0A0C14"
  image: assets/images/icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0A0C14"
    image: assets/images/icon.png

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
